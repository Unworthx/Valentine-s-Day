<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffeef2;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        h1 { color: #d63384; margin-bottom: 20px; text-align: center; }
        .container { text-align: center; position: relative; width: 100%; height: 300px; }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            position: absolute;
        }
        #yesBtn { background-color: #ff4d6d; color: white; left: 40%; transform: translateX(-50%); }
        #noBtn { background-color: #adb5bd; color: white; right: 40%; transform: translateX(50%); }
        #message { margin-top: 50px; font-size: 1.5rem; color: #d63384; display: none; }
        .heart { font-size: 50px; }
    </style>
</head>
<body>

    <div class="heart">💝</div>
    <h1>Will you be my Valentine?</h1>

    <div class="container">
        <button id="yesBtn">Yes!</button>
        <button id="noBtn">No</button>
    </div>

    <div id="message">Yay! I knew you'd say yes! 💖🌹</div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const message = document.getElementById('message');

        // Make the 'No' button run away
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        // What happens when she clicks 'Yes'
        yesBtn.addEventListener('click', () => {
            message.style.display = 'block';
            noBtn.style.display = 'none';
            yesBtn.style.display = 'none';
            document.querySelector('h1').innerText = "It's a Date!";
        });
    </script>
</body>
</html>
